<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Zen of Hangman</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <script type="module">
      const GA_TRACKING_ID = import.meta.env.VITE_GA_TRACKING_ID;

      if (GA_TRACKING_ID) {
        // Load gtag.js
        const gtagScript = document.createElement('script');
        gtagScript.setAttribute('async', '');
        gtagScript.src = `https://www.googletagmanager.com/gtag/js?id=${GA_TRACKING_ID}`;
        document.head.appendChild(gtagScript);

        // Load GTM (if you still want it, optional)
        const gtmScript = document.createElement('script');
        gtmScript.innerHTML = `
      (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
      new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
      'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','GTM-NPLSZVZ');
    `;
        document.head.appendChild(gtmScript);

        // Setup dataLayer and gtag config
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', GA_TRACKING_ID);
      }
    </script>
    <meta name="description" content="Hangman game" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <script src="src/main.js" type="module" defer></script>
  </head>
  <body>
    <header id="desktop-title">
      <h1>The Zen of Hangman</h1>
    </header>
    <div id="hangman">
      <div class="drawing" id="drawing">
        <div class="drawing__container"></div>
        <div class="drawing__message"></div>
      </div>
      <div id="result"></div>
    </div>
    <div id="board">
      <div id="chars" class="chars"></div>
      <div id="keyboard" class="keyboard"></div>
    </div>
    <div id="modal" class="modal" style="display: none">
      <div class="modal__background"></div>
      <div class="modal__main">
        <div class="modal__content"></div>
        <div class="modal__actions">
          <button id="new-game-button">Play New Game</button>
        </div>
      </div>
    </div>

    <footer>
      <h1 id="mobile-title">The Zen of Hangman</h1>
      Made with ♥ by
      <a target="_blank" rel="noopener" href="https://michaelkolesidis.com"
        >Michael Kolesidis</a
      >
      <br />
      <a
        target="_blank"
        rel="noopener"
        href="https://github.com/michaelkolesidis/hangman-javascript"
        >GitHub</a
      >
    </footer>
  </body>
</html>
