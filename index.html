<!doctype html>
<html lang="en">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-CLN0X1XD8N"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-CLN0X1XD8N');
    </script>
    <script>
      if (
        window.location.hostname === 'thezenofhangman.vercel.app' ||
        window.location.hostname === 'hangman.michaelkolesidis.com'
      ) {
        window.location.replace(
          'https://thumbfeed.com/the-zen-of-hangman/' +
            window.location.pathname,
        );
      }
    </script>
    <title>The Zen of Hangman</title>
    <meta
      name="description"
      content="A calm, minimalist take on hangman. Guess the word. Breathe. Repeat."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  </head>
  <body style="background-color: #f8efe7">
    <header id="desktop-title">
      <h1>The Zen of Hangman</h1>
    </header>
    <div id="hangman">
      <div class="drawing" id="drawing">
        <div class="drawing_container"></div>
        <div class="drawing_message"></div>
      </div>
      <div id="result"></div>
    </div>
    <div id="board">
      <div id="chars" class="chars"></div>
      <div id="keyboard" class="keyboard"></div>
    </div>
    <div id="modal" class="modal" style="display: none">
      <div class="modal_background"></div>
      <div class="modal_main">
        <div class="modal_content"></div>
        <div class="modal_actions">
          <button id="new-game-button">New Game</button>
        </div>
      </div>
    </div>

    <footer>
      <h1 id="mobile-title">The Zen of Hangman</h1>
      Made with &hearts; by
      <a target="_blank" rel="noopener" href="https://michaelkolesidis.com"
        >Michael Kolesidis</a
      >
      <br />
      <a
        target="_blank"
        rel="noopener"
        href="https://github.com/michaelkolesidis/hangman-javascript"
        >Source</a
      >
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
